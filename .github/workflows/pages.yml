name: Refresh report demos

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build --prefix node_modules/playwright-light-reporter
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
        continue-on-error: true

      - name: Sync reports into docs/
        run: |
          rm -rf docs/standard docs/bdd
          cp -r reports/standard docs/standard
          cp -r reports/bdd docs/bdd
          test -f docs/standard/index.html
          test -f docs/bdd/index.html

      - name: Commit updated demos
        uses: EndBug/add-and-commit@v9
        with:
          add: docs
          message: 'chore: refresh GitHub Pages report demos [skip ci]'
          default_author: github_actions[bot]
          default_email: 41898282+github-actions[bot]@users.noreply.github.com
